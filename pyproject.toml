[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aaa-memory"
version = "0.1.0"
description = "Personal AI Interaction Archive — Multi-tier memory for AI agent sessions"
authors = [{name = "Clawdi", email = "clawdi@example.com"}]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["memory", "ai", "retrieval", "clawmem", "graphiti", "memvid"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0",           # for OpenRouter LLM calls
    "pyyaml>=6.0",
    "numpy>=1.24",
    "sentence-transformers>=3.0.0",  # Gemma embedder
    "torch>=2.0",            # for transformers
    "requests>=2.28",
    "rich>=13.0",            # CLI UI
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
aaa-memory = "aaa_memory.cli:main"
aaa-memory-mcp = "aaa_memory.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

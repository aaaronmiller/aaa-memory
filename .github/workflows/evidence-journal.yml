name: Evidence journal checks
on:
  pull_request:
    paths:
      - "src/aaa_memory/evidence_journal.py"
      - "src/aaa_memory/capture_import.py"
      - "src/aaa_memory/artifact_registry.py"
      - "src/aaa_memory/cli_sessions.py"
      - "src/aaa_memory/__init__.py"
      - "src/aaa_memory/cli.py"
      - "tests/test_evidence_journal.py"
      - "tests/test_capture_import.py"
      - "tests/test_artifact_registry.py"
      - ".github/workflows/evidence-journal.yml"
  push:
    paths:
      - "src/aaa_memory/evidence_journal.py"
      - "src/aaa_memory/cli.py"
      - "tests/test_evidence_journal.py"
      - ".github/workflows/evidence-journal.yml"

jobs:
  evidence-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install targeted test dependencies
        run: python -m pip install pytest
      - name: Compile changed Python modules
        run: python -m py_compile src/aaa_memory/evidence_journal.py src/aaa_memory/capture_import.py src/aaa_memory/artifact_registry.py src/aaa_memory/cli.py src/aaa_memory/cli_sessions.py src/aaa_memory/__init__.py
      - name: Smoke test package CLI with no heavyweight model dependencies
        env:
          AAA_EVIDENCE_DB: ${{ runner.temp }}/evidence-smoke.sqlite
        run: |
          PYTHONPATH=src python -m aaa_memory evidence append --source ci --event-id smoke-1 --session CI --project smoke <<< "Source-linked evidence"
          PYTHONPATH=src python -m aaa_memory evidence search evidence --project smoke
          PYTHONPATH=src python -m aaa_memory evidence verify
      - name: Run journal tests without importing optional heavyweight providers
        run: PYTHONPATH=src python -m pytest -q tests/test_evidence_journal.py tests/test_capture_import.py tests/test_artifact_registry.py

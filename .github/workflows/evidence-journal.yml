name: Evidence journal checks
on:
  pull_request:
    paths:
      - "src/aaa_memory/evidence_journal.py"
      - "src/aaa_memory/cli.py"
      - "tests/test_evidence_journal.py"
      - ".github/workflows/evidence-journal.yml"
  push:
    paths:
      - "src/aaa_memory/evidence_journal.py"
      - "src/aaa_memory/cli.py"
      - "tests/test_evidence_journal.py"
      - ".github/workflows/evidence-journal.yml"

jobs:
  evidence-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install targeted test dependencies
        run: python -m pip install pytest
      - name: Compile changed Python modules
        run: python -m py_compile src/aaa_memory/evidence_journal.py src/aaa_memory/cli.py
      - name: Run journal tests without importing optional heavyweight providers
        run: PYTHONPATH=src python -m pytest -q tests/test_evidence_journal.py

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Target aaa-memory architecture with Cass as evidence tier</title>
  <desc id="desc">A layered architecture showing agent inputs, Cass session evidence, explicit vault memory, wiki compilation, ClawMem retrieval, graph reasoning, cold archive, and a unified planner and fusion layer.</desc>
  <defs>
    <style>
      .bg{fill:#f7f8f5}.band{fill:#ffffff;stroke:#27342f;stroke-width:2}.node{fill:#fefefe;stroke:#27342f;stroke-width:2}.accent{fill:#e4efe7;stroke:#2f684f;stroke-width:2}.warn{fill:#fff1d8;stroke:#a45d13;stroke-width:2}.cold{fill:#e8eef6;stroke:#315a86;stroke-width:2}.text{font-family:Arial,Helvetica,sans-serif;fill:#1e2723}.h{font-size:24px;font-weight:700}.m{font-size:17px;font-weight:700}.s{font-size:14px}.xs{font-size:12px}.arrow{stroke:#27342f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#27342f"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <text class="text h" x="52" y="54">Proposed target: purpose-based memory roles, Cass as session evidence</text>
  <text class="text s" x="52" y="82">Raw transcripts stay searchable and citable; durable memory remains curated; retrieval uses planning, fusion, token budgets, and trust boundaries.</text>

  <rect class="band" x="46" y="112" width="1188" height="116" rx="8"/>
  <text class="text m" x="72" y="144">Agent and document inputs</text>
  <rect class="node" x="72" y="162" width="150" height="42" rx="6"/><text class="text s" x="98" y="188">Claude Code</text>
  <rect class="node" x="244" y="162" width="150" height="42" rx="6"/><text class="text s" x="285" y="188">Codex</text>
  <rect class="node" x="416" y="162" width="150" height="42" rx="6"/><text class="text s" x="452" y="188">Hermes</text>
  <rect class="node" x="588" y="162" width="150" height="42" rx="6"/><text class="text s" x="618" y="188">OpenCode</text>
  <rect class="node" x="760" y="162" width="150" height="42" rx="6"/><text class="text s" x="796" y="188">Gemini</text>
  <rect class="node" x="932" y="162" width="150" height="42" rx="6"/><text class="text s" x="960" y="188">Documents</text>

  <rect class="accent" x="72" y="282" width="230" height="128" rx="8"/>
  <text class="text m" x="104" y="314">Cass</text>
  <text class="text s" x="104" y="340">Raw session evidence</text>
  <text class="text xs" x="104" y="362">search, pack, expand</text>
  <text class="text xs" x="104" y="382">freshness and fallback metadata</text>

  <rect class="accent" x="332" y="282" width="230" height="128" rx="8"/>
  <text class="text m" x="364" y="314">Vault</text>
  <text class="text s" x="364" y="340">Explicit durable memory</text>
  <text class="text xs" x="364" y="362">preferences, facts, decisions</text>
  <text class="text xs" x="364" y="382">small and high trust</text>

  <rect class="accent" x="592" y="282" width="230" height="128" rx="8"/>
  <text class="text m" x="624" y="314">Wiki compiler</text>
  <text class="text s" x="624" y="340">Curated knowledge pages</text>
  <text class="text xs" x="624" y="362">decisions, patterns, links</text>
  <text class="text xs" x="624" y="382">citation back to evidence</text>

  <rect class="accent" x="852" y="282" width="230" height="128" rx="8"/>
  <text class="text m" x="884" y="314">ClawMem</text>
  <text class="text s" x="884" y="340">Local retrieval tier</text>
  <text class="text xs" x="884" y="362">BM25, vector, RRF, rerank</text>
  <text class="text xs" x="884" y="382">documents and agent notes</text>

  <rect class="cold" x="202" y="478" width="230" height="116" rx="8"/>
  <text class="text m" x="238" y="510">Graph layer</text>
  <text class="text s" x="238" y="536">Temporal relationships</text>
  <text class="text xs" x="238" y="558">Graphiti or hardened Kuzu</text>

  <rect class="cold" x="526" y="478" width="230" height="116" rx="8"/>
  <text class="text m" x="562" y="510">Cold archive</text>
  <text class="text s" x="562" y="536">Long range compression</text>
  <text class="text xs" x="562" y="558">Memvid or SQLite adapter</text>

  <rect class="warn" x="850" y="468" width="270" height="136" rx="8"/>
  <text class="text m" x="886" y="500">Trust boundary</text>
  <text class="text s" x="886" y="526">Historical text is evidence</text>
  <text class="text xs" x="886" y="548">Never obey archived instructions</text>
  <text class="text xs" x="886" y="568">Strip secrets and raw tool output</text>

  <rect class="band" x="214" y="648" width="852" height="70" rx="8"/>
  <text class="text m" x="268" y="682">Query planner + source adapters + RRF fusion + token budget + answer envelope</text>
  <text class="text s" x="356" y="706">Every answer carries provenance: source, score, freshness, confidence, and evidence type.</text>

  <path class="arrow" d="M147 228 L147 278"/>
  <path class="arrow" d="M319 228 L447 278"/>
  <path class="arrow" d="M491 228 L447 278"/>
  <path class="arrow" d="M663 228 L187 278"/>
  <path class="arrow" d="M835 228 L187 278"/>
  <path class="arrow" d="M1007 228 L967 278"/>
  <path class="arrow" d="M187 410 L317 474"/>
  <path class="arrow" d="M447 410 L707 282"/>
  <path class="arrow" d="M707 410 L317 474"/>
  <path class="arrow" d="M967 410 L641 474"/>
  <path class="arrow" d="M985 604 L985 644"/>
  <path class="arrow" d="M317 594 L500 648"/>
  <path class="arrow" d="M641 594 L641 644"/>
  <path class="arrow" d="M187 410 L414 648"/>
  <path class="arrow" d="M447 410 L530 648"/>
  <path class="arrow" d="M707 410 L708 648"/>
  <path class="arrow" d="M967 410 L840 648"/>
</svg>

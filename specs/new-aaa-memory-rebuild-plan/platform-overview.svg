  <path class="arrow" d="M396 310 L150 344"/>
  <path class="arrow" d="M396 310 L396 344"/>
  <path class="arrow" d="M396 310 L630 344"/>
  <path class="arrow" d="M1017 196 L1017 230"/>
  <path class="arrow" d="M186 462 L186 498"/>
  <path class="arrow" d="M486 462 L486 498"/>
  <path class="arrow" d="M636 462 L786 360"/>
  <path class="dash" d="M186 546 L346 546"/>
  <path class="arrow" d="M626 546 L646 546"/>
  <path class="arrow" d="M800 350 L626 520"/>
  <path class="arrow" d="M486 592 L900 642"/>
  <path class="arrow" d="M1090 592 L1090 638"/>
  <text class="text xs" x="200" y="538">spend</text>
</svg>

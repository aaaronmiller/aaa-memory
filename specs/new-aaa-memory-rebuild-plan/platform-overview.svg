<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="t d">
  <title id="t">new-aaa-memory platform overview</title>
  <desc id="d">Surfaces feed ingestion into a tiered memory substrate; four engines (quota, dreamtime, retrieval, analytics) read the substrate and a central task board; analytics renders the webUX.</desc>
  <defs>
    <style>
      .bg{fill:#f7f8f5}.band{fill:#ffffff;stroke:#27342f;stroke-width:2}.node{fill:#fefefe;stroke:#27342f;stroke-width:2}
      .green{fill:#e4efe7;stroke:#2f684f;stroke-width:2}.gold{fill:#fff1d8;stroke:#a45d13;stroke-width:2}.blue{fill:#e8eef6;stroke:#315a86;stroke-width:2}.red{fill:#fbe6df;stroke:#a4441e;stroke-width:2}
      .text{font-family:Arial,Helvetica,sans-serif;fill:#1e2723}.h{font-size:24px;font-weight:700}.m{font-size:17px;font-weight:700}.s{font-size:14px}.xs{font-size:12px}
      .arrow{stroke:#27342f;stroke-width:2.5;fill:none;marker-end:url(#a)}.dash{stroke:#2f684f;stroke-width:2.5;fill:none;stroke-dasharray:6 5;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#27342f"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <text class="text h" x="52" y="50">Four engines, one substrate, one task board</text>
  <text class="text s" x="52" y="78">Surfaces feed ingestion; ingestion fills the tiered substrate; engines read the substrate and the board; analytics renders the webUX.</text>

  <rect class="band" x="46" y="104" width="700" height="92" rx="8"/>
  <text class="text m" x="70" y="132">Surfaces</text>
  <rect class="node" x="70" y="146" width="150" height="38" rx="6"/><text class="text s" x="86" y="170">cc / codex / pi</text>
  <rect class="node" x="236" y="146" width="150" height="38" rx="6"/><text class="text s" x="252" y="170">Obsidian vault</text>
  <rect class="node" x="402" y="146" width="150" height="38" rx="6"/><text class="text s" x="418" y="170">Web transcripts</text>
  <rect class="node" x="568" y="146" width="158" height="38" rx="6"/><text class="text s" x="584" y="170">Cass archive</text>

  <rect class="gold" x="800" y="104" width="434" height="92" rx="8"/>
  <text class="text m" x="824" y="132">Proxy</text>
  <text class="text s" x="824" y="158">Source of truth: live quota + model/provider config</text>
  <text class="text xs" x="824" y="180">read-only; never hardcoded; never bypassed</text>

  <rect class="band" x="46" y="232" width="700" height="78" rx="8"/>
  <text class="text m" x="70" y="260">Ingestion DAG</text>
  <text class="text s" x="70" y="288">normalize &#8594; dedup &#8594; classify &#8594; chunk &#8594; embed &#8594; tag &#8594; tier-route</text>

  <rect class="red" x="46" y="346" width="222" height="116" rx="8"/>
  <text class="text m" x="70" y="376">Hot</text><text class="text s" x="70" y="400">vault + resident index</text><text class="text xs" x="70" y="422">fast, small, high-trust</text>
  <rect class="gold" x="286" y="346" width="222" height="116" rx="8"/>
  <text class="text m" x="310" y="376">Warm</text><text class="text s" x="310" y="400">wiki + SQL joins + NoSQL</text><text class="text xs" x="310" y="422">curated, joinable</text>
  <rect class="blue" x="526" y="346" width="220" height="116" rx="8"/>
  <text class="text m" x="550" y="376">Cold</text><text class="text s" x="550" y="400">Memvid multi-bitrate</text><text class="text xs" x="550" y="422">archival</text>

  <rect class="gold" x="800" y="232" width="434" height="230" rx="8"/>
  <text class="text m" x="824" y="262">Task &amp; project board (the spine)</text>
  <rect class="node" x="824" y="280" width="180" height="40" rx="6"/><text class="text s" x="840" y="305">card + budget hint</text>
  <rect class="node" x="1018" y="280" width="190" height="40" rx="6"/><text class="text s" x="1034" y="305">Cass context summary</text>
  <rect class="node" x="824" y="332" width="384" height="40" rx="6"/><text class="text s" x="840" y="357">living HTML spec, cross-agent, dream-eligible</text>
  <text class="text xs" x="824" y="398">read by quota (budget&#8594;work), dreamtime (what to improve),</text>
  <text class="text xs" x="824" y="418">analytics (flow), retrieval (evidence on cards)</text>

  <rect class="green" x="46" y="500" width="280" height="92" rx="8"/>
  <text class="text m" x="70" y="530">Quota engine (G1)</text><text class="text s" x="70" y="556">poll &#8901; rank free-first</text><text class="text xs" x="70" y="578">budget &#8594; dreamtime; account</text>
  <rect class="green" x="346" y="500" width="280" height="92" rx="8"/>
  <text class="text m" x="370" y="530">Dreamtime (G2)</text><text class="text s" x="370" y="556">spend idle quota on real work</text><text class="text xs" x="370" y="578">DAG &#8901; gold standards &#8901; predict</text>
  <rect class="green" x="646" y="500" width="280" height="92" rx="8"/>
  <text class="text m" x="670" y="530">Retrieval (G6,8,9)</text><text class="text s" x="670" y="556">plan &#8901; fuse &#8901; pack &#8901; cite</text><text class="text xs" x="670" y="578">CLI-first; temporal</text>
  <rect class="green" x="946" y="500" width="288" height="92" rx="8"/>
  <text class="text m" x="970" y="530">Analytics (G3)</text><text class="text s" x="970" y="556">events &#8594; views &#8594; reviews</text><text class="text xs" x="970" y="578">user + AI scopes</text>

  <rect class="blue" x="646" y="640" width="588" height="74" rx="8"/>
  <text class="text m" x="670" y="670">Analytics webUX</text>
  <text class="text s" x="670" y="696">84 graphs, many interactive &#8901; the primary audit surface for AI work</text>


<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="t d">
  <title id="t">Metadata schema across tiers</title>
  <desc id="d">One MemoryMeta schema is attached at ingestion and rides each item through hot, warm, and cold tiers, enabling filters, SQL joins, temporal correlation, and agent-specific memory.</desc>
  <defs>
    <style>
      .bg{fill:#f7f8f5}.band{fill:#ffffff;stroke:#27342f;stroke-width:2}.node{fill:#fefefe;stroke:#27342f;stroke-width:2}
      .green{fill:#e4efe7;stroke:#2f684f;stroke-width:2}.gold{fill:#fff1d8;stroke:#a45d13;stroke-width:2}.blue{fill:#e8eef6;stroke:#315a86;stroke-width:2}.red{fill:#fbe6df;stroke:#a4441e;stroke-width:2}
      .text{font-family:Arial,Helvetica,sans-serif;fill:#1e2723}.mono{font-family:'Courier New',monospace;fill:#1e2723}.h{font-size:23px;font-weight:700}.m{font-size:16px;font-weight:700}.s{font-size:13px}.xs{font-size:11px}
      .arrow{stroke:#27342f;stroke-width:2.5;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#27342f"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="600"/>
  <text class="text h" x="48" y="46">One schema rides every item, hot to cold</text>
  <text class="text s" x="48" y="72">Attached at the ingestion Tag stage; additive and versioned; never repurpose a field.</text>

  <rect class="band" x="44" y="100" width="430" height="440" rx="8"/>
  <text class="text m" x="66" y="128">MemoryMeta</text>
  <rect class="node" x="66" y="142" width="386" height="60" rx="6"/>
  <text class="text s" x="80" y="164" font-weight="700">identity</text><text class="mono xs" x="80" y="186">id, content_hash</text>
  <rect class="green" x="66" y="210" width="386" height="74" rx="6"/>
  <text class="text s" x="80" y="232" font-weight="700">provenance</text><text class="mono xs" x="80" y="254">source, surface, agent,</text><text class="mono xs" x="80" y="272">session_id, project</text>
  <rect class="gold" x="66" y="292" width="386" height="74" rx="6"/>
  <text class="text s" x="80" y="314" font-weight="700">classification (G10)</text><text class="mono xs" x="80" y="336">item_type, topics, sensitivity,</text><text class="mono xs" x="80" y="354">agent_scope[]</text>
  <rect class="blue" x="66" y="374" width="386" height="62" rx="6"/>
  <text class="text s" x="80" y="396" font-weight="700">temporal (G9)</text><text class="mono xs" x="80" y="418">created_at, observed_at, usage_window</text>
  <rect class="red" x="66" y="444" width="386" height="84" rx="6"/>
  <text class="text s" x="80" y="466" font-weight="700">lifecycle + retrieval</text><text class="mono xs" x="80" y="488">tier, bitrate, review_state, promoted_from,</text><text class="mono xs" x="80" y="508">embedding_ref, citations, quality_score, confidence</text>

  <rect class="red" x="540" y="120" width="220" height="120" rx="8"/>
  <text class="text m" x="562" y="150">Hot</text>
  <text class="text s" x="562" y="176">filter by project/agent/type</text>
  <text class="text xs" x="562" y="200">trust via review_state +</text>
  <text class="text xs" x="562" y="218">confidence</text>

  <rect class="gold" x="540" y="252" width="220" height="120" rx="8"/>
  <text class="text m" x="562" y="282">Warm</text>
  <text class="text s" x="562" y="308">SQL joins on fields</text>
  <text class="text xs" x="562" y="332">YAML filters (wiki),</text>
  <text class="text xs" x="562" y="350">temporal correlation</text>

  <rect class="blue" x="540" y="384" width="220" height="120" rx="8"/>
  <text class="text m" x="562" y="414">Cold</text>
  <text class="text s" x="562" y="440">bitrate selection</text>
  <text class="text xs" x="562" y="464">enough metadata to</text>
  <text class="text xs" x="562" y="482">rehydrate faithfully</text>

  <rect class="band" x="824" y="160" width="412" height="320" rx="8"/>
  <text class="text m" x="846" y="190">What the schema unlocks</text>
  <rect class="node" x="846" y="206" width="368" height="44" rx="6"/><text class="text s" x="862" y="234">YAML filters in the wiki (G15)</text>
  <rect class="node" x="846" y="258" width="368" height="44" rx="6"/><text class="text s" x="862" y="286">inner/outer SQL joins (G7)</text>
  <rect class="node" x="846" y="310" width="368" height="44" rx="6"/><text class="text s" x="862" y="338">temporal correlation (G9)</text>
  <rect class="node" x="846" y="362" width="368" height="44" rx="6"/><text class="text s" x="862" y="390">agent-specific memory via agent_scope</text>
  <rect class="node" x="846" y="414" width="368" height="44" rx="6"/><text class="text s" x="862" y="442">promotion + provenance + audit</text>

  <path class="arrow" d="M474 180 L538 180"/>
  <path class="arrow" d="M474 312 L538 312"/>
  <path class="arrow" d="M474 470 L538 444"/>
  <path class="arrow" d="M760 180 L822 230"/>
  <path class="arrow" d="M760 312 L822 332"/>
  <path class="arrow" d="M760 444 L822 420"/>
</svg>
